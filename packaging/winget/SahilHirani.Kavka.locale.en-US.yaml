Copyright: Copyright (C) 2026 Sahil Hirani
CopyrightUrl: https://github.com/sahilhirani/kavka/blob/main/LICENSE
ShortDescription: A fast, fully open-source desktop client for Apache Kafka.
Description: >-
  Kavka is a desktop client for Apache Kafka for macOS and Windows. It browses
  and searches topics, manages consumer groups, ACLs, quotas, partition
  reassignment, Kafka Connect and Schema Registry, charts lag and throughput,
  runs SQL over topics, and ships an MCP server so an AI assistant can read your
  clusters. Every feature is free: there are no paid tiers, no licence keys and
  no server component. Connection passwords are stored in Windows Credential
  Manager, and nothing about your clusters leaves the machine.
Moniker: kavka
