PackageVersion: "{{VERSION}}"
PackageLocale: en-US
Publisher: Sahil Hirani
PublisherUrl: https://github.com/sahilhirani
PublisherSupportUrl: https://github.com/sahilhirani/kavka/issues
Author: Sahil Hirani
PackageName: Kavka
PackageUrl: https://github.com/sahilhirani/kavka
License: AGPL-3.0-only
