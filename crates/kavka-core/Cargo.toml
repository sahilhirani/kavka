[package]
name = "kavka-core"
description = "Kavka core: connection management, admin ops, consume/search engine, serdes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Base Kafka support (PLAINTEXT + SASL_PLAINTEXT). librdkafka is compiled via
# cmake-build (see docs/ARCHITECTURE.md D2) — requires CMake + MSVC Build Tools.
kafka = ["dep:rdkafka"]
# TLS/SASL_SSL: vendored OpenSSL build. On Windows this additionally requires
# Strawberry Perl + NASM. Kerberos/GSSAPI is added per-platform later (SSPI is
# built into librdkafka's Windows cmake build; cyrus-sasl on unix via CI).
kafka-ssl = ["kafka", "rdkafka/ssl-vendored"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# One native backend per target OS — without these keyring silently uses an
# in-memory mock store.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

rdkafka = { version = "0.37", features = ["cmake-build", "tokio"], optional = true }
