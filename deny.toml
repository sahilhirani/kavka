# cargo-deny policy for the Kavka workspace. Enforced by
# .github/workflows/supply-chain.yml on every push, every pull request, and
# weekly.
#
# What each section is for:
#   advisories -> RustSec advisories and yanked crates are errors, except the
#                 ones named below with the reason they are accepted
#   licenses   -> only terms a project DISTRIBUTED under AGPL-3.0-only can
#                 satisfy; anything else, including a license that cannot be
#                 determined, is an error
#   bans       -> duplicate-version visibility
#   sources    -> crates.io and nothing else; a git dependency or an alternate
#                 registry in this tree is a finding
#
# The ignore list below is the part that rots. Each entry says who owns the fix
# and what would let it be deleted; re-check them when Tauri is upgraded.

[graph]
# Resolve every feature so the gated tiers (kafka, kafka-ssl, msk-iam,
# wasm-serdes) are all in the graph, not just the default (bare) tier.
all-features = true

[advisories]
# Vulnerabilities and yanked crates are hard failures.
yanked = "deny"

# ACCEPTED ADVISORIES. Every one of these is `unmaintained` — a maintenance
# status, not a vulnerability. There are no known-vulnerable crates in this
# tree, and if one appears this gate turns red because it will not be on this
# list.
ignore = [
    # ---------------------------------------------------------------------
    # SHIPPED. These five reach the Windows and macOS binaries users install,
    # through Tauri's own dependency chain:
    #   unic-* 0.9.0 <- urlpattern 0.3.0 <- tauri-utils <- tauri
    # There is no version to upgrade to. urlpattern 0.6.0 already dropped the
    # unic family, but tauri-utils requires ^0.3 and no other 0.3.x exists, so
    # neither `cargo update` nor a [patch] can reach it — only an upstream
    # Tauri change can. Tracked as rustsec/advisory-db#2414.
    # These are static Unicode tables parsing developer-authored capability URL
    # patterns; accepted knowingly, not overlooked.
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident

    # ---------------------------------------------------------------------
    # LINUX-ONLY — NOT BUILT TODAY. RE-EVALUATE BEFORE ADDING A LINUX RELEASE
    # TARGET. release.yml builds macOS and Windows only; `cargo tree -i` finds
    # none of these on aarch64-apple-darwin, x86_64-apple-darwin or
    # x86_64-pc-windows-msvc. They are here because cargo-deny resolves the
    # graph for all targets, not because they ship.
    #
    # They are the GTK3 stack under Tauri 2's Linux backend
    # (gtk <- muda <- tauri) plus glib's proc-macro dependency. Adding a Linux
    # leg means re-running this decision: glib's separate unsound advisory
    # (RUSTSEC-2024-0429, which does not fail this check) has a patch in
    # >=0.20.0, reachable only by a Tauri upgrade off the gtk 0.18 stack.
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2024-0370", # proc-macro-error (build-time only, via glib-macros)
]

[licenses]
# Permissive licenses only. Kavka ships as AGPL-3.0-only; a dependency under any
# of these can be combined into an AGPL-3.0 distribution without a term conflict.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Weak, file-scoped copyleft. Explicitly GPL/AGPL-compatible via MPL-2.0
    # section 3.3 UNLESS a file is marked "Incompatible With Secondary
    # Licenses".
    "MPL-2.0",
    # OpenSSL's license is Apache-2.0 since 3.0; the SPDX id shows up on the
    # vendored openssl-sys chain that kafka-ssl builds.
    "OpenSSL",
]
# Anything not on the list above is an error, including crates whose license
# expression cannot be determined — that is the point of the check.
confidence-threshold = 0.8

[licenses.private]
# Kavka's own four crates are AGPL-3.0-only, which is deliberately NOT on the
# allow list above: that list governs what Kavka may CONSUME, and adding
# AGPL-3.0-only to it would also wave through an AGPL *dependency* unnoticed.
# All four set `publish = false` (inherited from [workspace.package]), so this
# switch skips them by publishability rather than by name — no hand-maintained
# exception list to drift out of date.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
# Supply chain: crates.io and nothing else. A git dependency or an alternate
# registry in this tree is a finding.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
