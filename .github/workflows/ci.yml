name: CI

on:
  push:
    branches: [main]
  pull_request:

# Declared rather than inherited. Without this block the token's scope is
# whatever the repo-wide default happens to be, which is a setting no commit
# pins; naming it here sets every unlisted scope to `none`. Neither job writes
# anything back — no `gh`, no artifact upload, no secrets.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: Lint, test (Linux)
    runs-on: ubuntu-latest
    env:
      # The debug test binaries (DataFusion + wasmtime + librdkafka in one
      # workspace) overflow the runner's disk with full debuginfo — the linker
      # dies with SIGBUS. Line tables are enough for CI backtraces.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      # Every third-party `uses:` in this repo is pinned to a full commit SHA
      # with the human-readable ref in the trailing comment. A tag is mutable —
      # the upstream can re-point it at any commit, which is exactly how the
      # tj-actions/changed-files compromise reached thousands of runners — and
      # `dtolnay/rust-toolchain@stable` is not even a tag, it is a branch that
      # moves. Dependabot's github-actions ecosystem (.github/dependabot.yml)
      # bumps these SHAs and rewrites the comment, so the pins do not freeze.
      #
      # `persist-credentials: false` keeps GITHUB_TOKEN out of .git/config,
      # where `npm ci`'s lifecycle scripts and every crate's build.rs could
      # otherwise read it. Nothing here does an authenticated git operation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-latest ships ~25 GB of toolchains this job never uses; the
      # workspace's target dir needs the room more than dotnet/android do.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The SHA below is a commit on the action's `stable` BRANCH, whose
      # action.yml defaults `toolchain` to stable. `toolchain: stable` is
      # spelled out anyway so the pin says what it installs and stays correct
      # if it is ever re-pointed at a commit on master, where the input is
      # required and has no default.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      # keyring's secret-service backend links against libdbus on Linux;
      # librdkafka's cmake build enables its curl-based OAuth/HTTP helpers on
      # Linux and needs the libcurl headers.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libcurl4-openssl-dev

      - name: Format
        run: cargo fmt --all -- --check

      # The crate must lint clean BOTH without the kafka feature (the
      # no-CMake tooling build) and with it.
      - name: Clippy (no default features)
        run: cargo clippy --locked -p kavka-core -- -D warnings

      - name: Clippy (kafka)
        run: cargo clippy --locked -p kavka-core --features kafka -- -D warnings

      # The WASM serde tier stands alone (a decoder needs no cluster), so it
      # lints on its own.
      - name: Clippy (wasm serdes)
        run: cargo clippy --locked -p kavka-core --features wasm-serdes --all-targets -- -D warnings

      # And at the tier the desktop app ships, which is the only one where the
      # plugin actually meets the read paths: `ClusterConnection::decoder_for`
      # and its four callers in `consume`, `search`, `sql` and `xcluster` are
      # compiled only when `kafka` and `wasm-serdes` are both on, and
      # `kafka-ssl` is the combination that is green with `--all-targets`
      # (plain `kafka` leaves the ssl-gated test helpers in `connection.rs`
      # unreferenced, which is why the step above it has no `--all-targets`).
      - name: Clippy (kafka-ssl, all targets)
        run: cargo clippy --locked -p kavka-core --features kafka-ssl --all-targets -- -D warnings

      # The MCP server (crates/kavka-mcp). It builds kavka-core at the
      # kafka-ssl tier — the same one the desktop app ships — because it opens
      # the same connections from the same profiles.json.
      - name: Clippy (MCP server)
        run: cargo clippy --locked -p kavka-mcp --all-targets -- -D warnings

      # The companion CLI (crates/kavka-cli), at the same tier and for the same
      # reason: it opens the same connections from the same profiles.json.
      - name: Clippy (CLI)
        run: cargo clippy --locked -p kavka-cli --all-targets -- -D warnings

      - name: Start local Kafka (KRaft)
        run: docker compose -f dev/docker-compose.yml up -d --wait

      # kafka-ssl is what the desktop app ships; it also unlocks the
      # ssl-asserting unit tests (vendored OpenSSL needs the runner's perl).
      - name: Unit + integration tests
        run: cargo test --locked -p kavka-core --features kafka-ssl
        env:
          KAVKA_IT: "1"

      # The MCP suite spawns the built binary and drives it over real pipes
      # against the cluster started above, so it runs here rather than beside
      # the core's own tests.
      - name: MCP server tests
        run: cargo test --locked -p kavka-mcp
        env:
          KAVKA_IT: "1"

      # The CLI suite spawns the built binary with a real argv against the same
      # cluster. Its unit half (the flag surface, the output modes, the write
      # gate, the §7 error table) needs no broker and runs here either way.
      - name: CLI tests
        run: cargo test --locked -p kavka-cli
        env:
          KAVKA_IT: "1"

      # v7, not v4: v4 runs on the node20 Actions runtime GitHub is retiring.
      # v5 added automatic package-manager detection (keyed off a
      # `packageManager` field this repo does not have) and v6 restricted
      # automatic caching to npm; both sites here pass `cache: npm` explicitly,
      # so neither change reaches this workflow.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Frontend typecheck + build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      # The packaging templates, rendered. This runs on every PR because
      # `packaging/render.mjs` is only ever executed on release day otherwise —
      # a placeholder a template grew and the renderer cannot fill is an error
      # nobody would see until the tag was already pushed.
      #
      # No --assets, deliberately: that mode substitutes the version and the
      # URLs, writes `TODO-…` checksums and says on stderr that the output is
      # not submittable. It still parses and renders every template and still
      # fails on an unknown placeholder, which is the half that can rot here.
      - name: Packaging manifests render
        run: node packaging/render.mjs --version 0.0.0 --out "$RUNNER_TEMP/pkg"

  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # tauri's generate_context! wants the frontend dist to exist.
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Check workspace (builds librdkafka via CMake)
        run: cargo check --locked --workspace
