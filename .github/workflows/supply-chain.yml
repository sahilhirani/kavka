# The dependency gate: RustSec advisories, yanked crates, license terms, and
# where crates come from.
#
# WHY THIS IS A SEPARATE WORKFLOW AND NOT A JOB IN ci.yml. It needs a `schedule`
# trigger — advisories are published against code that has not changed, so a
# gate that only runs on push finds them whenever somebody next happens to
# commit. Putting the cron on ci.yml would drag the Rust build, the Kafka
# container and the Windows leg along with it every week, so the gate lives
# here instead. It still runs on every push and pull request, which is the half
# that blocks a bad dependency from landing.
#
# WHAT IT ACTUALLY PROTECTS. release.yml publishes signed installers on every
# merge to main and existing installs pick them up through the updater, so a new
# advisory in the shipped graph reaches real machines with nothing in between.
# This is the "something objects" step.
#
# The policy — allowed licenses, crates.io as the only source, and the
# accepted-advisory list with its reasoning — is in deny.toml at the repo root.
name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 07:00 UTC. A new advisory needs no commit to appear, so the
    # gate cannot only run when somebody pushes.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Advisories, licenses, sources
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned for the same reason as every other action in this repo; see
      # the comment in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # Prebuilt binaries. `cargo install` would compile both tools from source
      # on every run, which costs minutes for a job whose whole job is to be
      # fast enough that nobody is tempted to skip it.
      #
      # Deliberately NOT version-pinned: cargo-deny parses the advisory
      # database, and an old release fails hard on advisory formats it predates
      # (0.18.4 cannot parse the CVSS 4.0 vector in RUSTSEC-2026-0146 and exits
      # non-zero before checking anything). A gate that breaks on new data is
      # worse than no gate, because it trains people to ignore it.
      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cargo-audit,cargo-deny

      # Plain `cargo audit`, not `--deny warnings`. Today's tree has 0
      # vulnerabilities and 17 warnings, every one of them an unmaintained-crate
      # notice with no fix available (they belong to Tauri's own dependencies —
      # see docs/SECURITY-AUDIT.md). `--deny warnings` would make this red on
      # day one for things nobody here can fix, and a permanently red gate is
      # noise. Vulnerabilities still fail the step.
      - name: cargo audit
        run: cargo audit

      # The gate with teeth. `advisories` fails on any RustSec advisory or
      # yanked crate that is not named in deny.toml's ignore list; `sources`
      # fails on any crate not from crates.io; `licenses` fails on terms an
      # AGPL-3.0 distribution cannot satisfy; `bans` reports duplicates.
      - name: cargo deny
        run: cargo deny check advisories bans licenses sources
