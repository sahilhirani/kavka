# Deploys docs-site/ to GitHub Pages on every merge to main.
#
# The site is hand-rolled HTML/CSS with no build system (docs-site/README.md),
# so "building" it is copying files: the site itself plus the app screenshots
# it embeds, which live in docs/screenshots and are copied in rather than
# duplicated in git.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned like every other action in this repo; see the comment in
      # ci.yml. This job's token is contents:read and it holds no secrets, so
      # the stakes are lower than release.yml's — the pins are here for
      # consistency, so "is everything pinned?" has one answer.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp -r docs-site/. _site/
          rm -f _site/README.md
          cp docs/screenshots/*.png docs/screenshots/*.gif _site/screenshots/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
