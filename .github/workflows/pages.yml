# Deploys docs-site/ to GitHub Pages on every merge to main.
#
# The site is hand-rolled HTML/CSS with no build system (docs-site/README.md),
# so "building" it is copying files: the site itself plus the app screenshots
# it embeds, which live in docs/screenshots and are copied in rather than
# duplicated in git.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# FIELD LESSON (2026-08-06): Pages identifies a deployment by the COMMIT SHA
# (pages_build_version). If a deployment for a SHA is ever cancelled — this
# concurrency group's cancel-in-progress, or the deploy action's poll timeout
# during backend congestion — every re-run and workflow_dispatch of that same
# SHA is born cancelled. The fix is never "re-run"; it is any new commit that
# touches the paths above.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned like every other action in this repo; see the comment in
      # ci.yml. This job's token is contents:read and it holds no secrets, so
      # the stakes are lower than release.yml's — the pins are here for
      # consistency, so "is everything pinned?" has one answer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp -r docs-site/. _site/
          rm -f _site/README.md
          cp docs/screenshots/*.png docs/screenshots/*.gif _site/screenshots/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # v5 of this action flips include-hidden-files to false, which would
          # silently drop _site/.nojekyll — the file docs-site/README.md calls
          # load-bearing. Stated explicitly so the artifact stays byte-identical
          # across that upgrade instead of depending on a default.
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
