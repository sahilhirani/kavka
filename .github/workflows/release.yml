# Builds installers and publishes a GitHub Release two ways:
#
# 1. EVERY push/merge to main → an automated build release, tagged
#    v<version>-build.<run> and marked PRERELEASE, so the Releases page
#    always carries installers for the latest main without pretending each
#    merge is a stable version.
# 2. A version tag pushed by a human → the stable release path:
#      git tag v0.1.0 && git push origin v0.1.0
#    Only these get the package-manager manifests rendered and attached.
#
# Produces: Windows .exe (NSIS) + .msi, macOS .dmg for Apple Silicon and
# Intel. Users download from the Releases page and install — no toolchain
# needed. Binaries are UNSIGNED until code-signing certs exist (Phase 6);
# macOS calls un-notarized downloads "damaged" — the release body carries
# the honest xattr instruction.
#
# Every release ALSO carries updater artifacts and a `latest.json` manifest,
# minisign-signed with TAURI_SIGNING_PRIVATE_KEY, which is what lets the app
# install an update in place instead of sending a user back to this page.
# Distribution signing (Authenticode/notarization) and update signing are
# different things: the second is what exists today, and it only proves the
# bytes came from this workflow — not that an OS will trust them.
name: Release

on:
  push:
    # v*-build.* is what this workflow itself mints for automated builds —
    # excluded so a manually-published build release can never re-trigger
    # the stable-tag path (the automated path is already safe: refs created
    # with GITHUB_TOKEN don't trigger workflows, but a human's token does,
    # and that rebuilt everything and failed the manifests job twice).
    tags: ["v*", "!v*-build.*"]
    branches: [main]

permissions:
  contents: write

# Rapid merges to main supersede each other's build; a tag build is never
# cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    # The signing key lives in the `release` environment, not in repo-level
    # secrets: the environment only deploys from `main` and `v*` tags, so a
    # workflow run from any other ref asks for the key and gets nothing.
    # SECURITY-AUDIT.md CI-02.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          # Cross-compiled from an Apple Silicon runner: macos-13 was
          # GitHub's last Intel image and it is retired — jobs targeting it
          # queue forever. Rust builds x86_64-apple-darwin from arm64 natively
          # (same OS, second target), and the cmake/openssl vendored builds
          # follow the cargo target.
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            target: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      # SHA PINS. This job holds TAURI_SIGNING_PRIVATE_KEY, and every step in it
      # shares one runner VM — so an earlier action can plant code that reads
      # the later signing step's environment. A mutable tag means the upstream
      # (or whoever compromises it) chooses what runs here, and the key it could
      # steal signs updates that every installed copy of Kavka already trusts,
      # with no revocation channel. That is not hypothetical: tj-actions/
      # changed-files was compromised exactly this way in March 2025 by
      # re-pointing its tags. Each SHA below is what the mutable ref resolved to
      # when it was pinned, so this changed no behaviour; Dependabot
      # (.github/dependabot.yml) keeps them current.
      #
      # `persist-credentials: false` keeps the contents:write GITHUB_TOKEN out
      # of .git/config, where `npm ci`'s lifecycle scripts and every crate's
      # build.rs in this job could otherwise read it. Nothing here needs it:
      # tauri-action takes its token from the step env below, and every `gh`
      # call sets GITHUB_TOKEN in its own step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SHA is a commit on the action's `stable` BRANCH — a branch, note,
      # which moves more freely than a tag. Its action.yml defaults `toolchain`
      # to stable; the input is spelled out anyway so the pin states what it
      # installs. This action installs the compiler that produces the bytes
      # this job signs, which is why it is pinned as carefully as the signer.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # v7 runs on the node24 Actions runtime; v4's node20 runtime is being
      # retired. Both cache sites pass `cache: npm` explicitly, so v5's
      # package-manager auto-detection and v6's caching restriction do not
      # apply here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      # RS-01 (docs/SECURITY-AUDIT.md): the release must build exactly the
      # reviewed lockfile. This fails when Cargo.toml and Cargo.lock disagree,
      # so a manifest change that forgot its lockfile stops HERE instead of
      # being silently re-resolved, signed, and auto-installed. Fail-closed on
      # purpose: it does not depend on any flag reaching cargo through
      # tauri-action.
      - name: Refuse an unreviewed dependency resolution
        # shell: bash is load-bearing: without it, windows-latest runs this
        # under pwsh, where the /dev/null redirect is read as a literal file
        # path that cannot exist, and the step fails unconditionally — which
        # killed the Windows leg of the first release after this step landed.
        # Found by independent verification, not by the author.
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

      # One rule for both triggers. A tag push releases as itself; a main
      # push mints v<version>-build.<run> (run number is identical across the
      # three matrix legs, so they all attach to one release).
      - name: Release metadata
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            NAME="Kavka $GITHUB_REF_NAME"
            PRERELEASE=false
            NOTE="the package-manager manifests rendered for this version."
          else
            VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
            TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
            NAME="Kavka ${VERSION} build ${GITHUB_RUN_NUMBER}"
            PRERELEASE=true
            NOTE="This is an automated build of main at ${GITHUB_SHA:0:7} — the newest Kavka there is, marked pre-release because no human blessed it. Stable versions carry a plain v* tag."
          fi
          {
            echo "tag=$TAG"
            echo "name=$NAME"
            echo "prerelease=$PRERELEASE"
            echo "note=$NOTE"
          } >> "$GITHUB_OUTPUT"

      # The signing key is what turns `bundle.createUpdaterArtifacts` into
      # something the app will accept: Tauri writes a .sig beside each updater
      # bundle and tauri-action inlines those signatures into latest.json. The
      # build FAILS if the key is absent while updater artifacts are on, so
      # this env block is load-bearing rather than decoration — safe only
      # because this workflow never runs on `pull_request`, where a fork gets
      # no secrets and every build would break.
      #
      # KAVKA_BUILD stamps the run number into the binary at COMPILE time
      # (option_env!), which is how a build install knows it is a build
      # without a prerelease string in tauri.conf.json version — MSI/WiX
      # refuses those. The `|| ''` is the entire point of the expression:
      # `A && B` on its own evaluates to the literal string "false" on the tag
      # path, and "false" is not empty, so a stable install would come out
      # believing its build number was "false". `|| ''` turns the miss into an
      # empty string, which the Rust side parses to null. (run_number is never
      # 0, so it can never be falsy on the branch path.) Cargo fingerprints
      # env vars read through option_env!, so a rust-cache hit from a run with
      # a different number still recompiles rather than baking in a stale one.
      # Pinned to the commit `v0` pointed at, not to `v0`. This is the step that
      # receives the updater signing key, so it is the one whose mutable tag
      # mattered most. NOT moved to v1 in the same change: action-v1.0.0 alters
      # latest.json's URLs, the updater artifact filenames, and how it treats an
      # existing non-draft release — all load-bearing here. That evaluation
      # belongs on a throwaway tag, not in a security sweep.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          KAVKA_BUILD: ${{ github.ref_type == 'branch' && github.run_number || '' }}
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: ${{ steps.meta.outputs.name }}
          releaseBody: |
            Downloads:
            - **Windows:** `.exe` (NSIS installer) or `.msi`
            - **macOS:** `.dmg` — Apple Silicon (`aarch64`) or Intel (`x64`)

            Binaries are not yet code-signed. macOS will say the app "is
            damaged" — it isn't (check `SHA256SUMS.txt`); that is Gatekeeper's
            wording for un-notarized downloads. After installing, run
            `xattr -cr /Applications/Kavka.app` once. Alongside the installers,
            ${{ steps.meta.outputs.note }}

            Kavka is free and open source (AGPL-3.0). If it saves you time:
            https://buymeacoffee.com/sahilhirani ☕
          # Branch builds stay DRAFT until every leg has uploaded, then the
          # finalize job flips them public — so a cancelled or half-done run
          # is never a visible release with missing installers (build.1 was,
          # once). Tag builds keep publish-as-you-go: they are deliberate,
          # rare, and the manifests job needs the published tag.
          releaseDraft: ${{ github.ref_type == 'branch' }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          args: ${{ matrix.args }}
          # latest.json, the updater's manifest. This input defaults to true,
          # but it is spelled out because it is the one switch deciding whether
          # a release is installable in-app or only downloadable by hand.
          #
          # Each matrix leg merges only ITS platforms into the release's
          # existing latest.json, so the manifest is complete only after all
          # three have run. That merge reads the current manifest back through
          # `GET /releases/assets/{asset_id}` with `Accept:
          # application/octet-stream` — an authenticated read by id, not the
          # public download URL — which is exactly why it still works while the
          # release is a DRAFT and has no public URLs. The read-modify-write
          # has no locking, though, so two legs finishing together can drop one
          # of the entries; finalize re-reads the manifest and refuses to
          # publish a build whose merge came back short.
          uploadUpdaterJson: true
          # Windows ships both an NSIS .exe and a WiX .msi, and the default
          # points the updater at the .msi. NSIS is the one that can install
          # over a running app and relaunch it, which is the flow the app
          # promises the user; WiX cannot. Choose it explicitly.
          updaterJsonPreferNsis: true

  # Renders the package-manager manifests against the release that was just
  # published and attaches them to it — and then, in its last step, verifies
  # that release's `latest.json`, which is the tag path's half of the gate
  # `finalize` runs on every branch build.
  #
  # WHY AFTER, AND NOT IN THE BUILD MATRIX. A winget manifest names the Windows
  # installer AND both macOS disk images, so it cannot be written by any single
  # matrix leg — the checksums do not all exist until every leg has uploaded.
  # This job downloads what the release actually has, which also means the
  # manifests can never disagree with it.
  #
  # WHAT IT DOES NOT DO: submit anything. No PR to winget-pkgs, no `choco push`,
  # no PR to homebrew-cask. Those need credentials this workflow deliberately
  # does not hold, and each ecosystem has a human review queue that a project's
  # first automated submission is a poor way to enter. The rendered files are
  # attached so the human step is "download three files and open a PR" rather
  # than "hand-edit eight checksums" — see packaging/README.md.
  manifests:
    name: Package manifests
    needs: build
    # Stable tags only: winget/choco/homebrew manifests for every merge to
    # main would be noise nobody can submit anyway.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Only the installers: `--pattern` keeps the source archives GitHub
      # attaches to every tag out of the checksum directory, where a stray file
      # is at best noise and at worst hashed into the wrong placeholder.
      #
      # THE TAG GOES THROUGH THE ENVIRONMENT, not through `${{ }}`. Actions
      # expands an expression textually before bash ever parses the line, and
      # bash still evaluates `$(...)` and backticks inside double quotes — so a
      # tag named `v1.0.0$(curl …)` would be a command, not a string, in a job
      # holding a contents:write token. Git permits that name and this workflow
      # triggers on `v*`. Read as `"$TAG"` it is only ever text. The same is
      # done for the two steps below; `github.repository` needs no such
      # treatment (owner/repo cannot contain shell metacharacters), and the
      # `${GITHUB_REF_NAME#v}` lines were already safe for this reason.
      - name: Download the release's installers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --pattern 'Kavka_*.exe' \
            --pattern 'Kavka_*.msi' \
            --pattern 'Kavka_*.dmg'
          ls -la release-assets

      # `render.mjs` fails if any expected asset is missing rather than writing
      # a manifest with a placeholder checksum in it, so this step failing is
      # the intended way to find out that Tauri's artifact naming changed.
      - name: Render manifests
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node packaging/render.mjs --version "$VERSION" --assets ./release-assets

      # Flat, and named so the three ecosystems do not collide: a person
      # downloading these is about to copy them into three different forks.
      - name: Attach manifests to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p manifests
          cp packaging/out/winget/SahilHirani.Kavka.yaml                  "manifests/winget-SahilHirani.Kavka.yaml"
          cp packaging/out/winget/SahilHirani.Kavka.installer.yaml        "manifests/winget-SahilHirani.Kavka.installer.yaml"
          cp packaging/out/winget/SahilHirani.Kavka.locale.en-US.yaml     "manifests/winget-SahilHirani.Kavka.locale.en-US.yaml"
          cp packaging/out/chocolatey/kavka.nuspec                        "manifests/chocolatey-kavka.nuspec"
          cp packaging/out/chocolatey/tools/chocolateyinstall.ps1         "manifests/chocolatey-chocolateyinstall.ps1"
          cp packaging/out/homebrew/kavka.rb                              "manifests/homebrew-kavka.rb"
          # SHA256SUMS is worth as much as the manifests: it is what somebody
          # verifying a download by hand needs, and what a mirror needs to
          # prove it mirrored the right bytes.
          (cd release-assets && sha256sum Kavka_* > ../manifests/SHA256SUMS.txt)
          gh release upload "$TAG" manifests/* \
            --repo "${{ github.repository }}" --clobber

      # The same completeness gate `finalize` runs on branch builds, on the
      # path that actually matters more.
      #
      # WHY IT HAS TO BE HERE AND NOT THERE. `finalize` is `if: ref_type ==
      # 'branch'`, so nothing checked the manifest of a STABLE tag — and a tag
      # is published as-you-go (`releaseDraft: false`), so a leg that dropped
      # its entry in tauri-action's unlocked read-modify-write of latest.json
      # ships to the release every stable user auto-updates against. This job
      # is the tag path's only after-the-fact step, it already runs on tags
      # only, it already talks to the published release, and it already has
      # node. So it is where the check belongs.
      #
      # A missing platform is not silent-by-accident: tauri-action only
      # `console.warn`s when a leg has no signatures or no updater artifacts to
      # contribute, so nothing upstream turns a short manifest red. The
      # user-visible failure without this gate is honest but late — the app
      # offers the update, downloads nothing, and says "That release doesn't
      # carry an installer for this platform."
      - name: Verify the updater manifest is complete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.id')
          MANIFEST_ID=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "latest.json") | .id' | head -1)
          [ -n "$MANIFEST_ID" ] || { echo "no latest.json on $TAG — updater artifacts never made it; in-app updates would be broken for this release"; exit 1; }
          gh api "repos/${{ github.repository }}/releases/assets/$MANIFEST_ID" \
            -H "Accept: application/octet-stream" > latest.json
          node -e '
            const m = JSON.parse(require("fs").readFileSync("latest.json", "utf8"));
            const platforms = m.platforms ?? {};
            const missing = ["darwin-aarch64", "darwin-x86_64", "windows-x86_64"]
              .filter((p) => !platforms[p]?.url || !platforms[p]?.signature);
            const carries = Object.keys(platforms).join(", ") || "nothing";
            if (missing.length) {
              console.error("latest.json has no signed entry for " + missing.join(", ") +
                " — a leg was lost in the merge; it carries " + carries);
              process.exit(1);
            }
            console.log("latest.json is complete: " + carries);
          '

  # Branch builds finish here: checksum the draft's installers, attach
  # SHA256SUMS, verify the updater manifest is complete, sweep any older
  # build-drafts a cancelled run left behind, and only then flip the release
  # public. Users never see a release that is missing a platform — in the
  # download list or in latest.json.
  finalize:
    name: Publish automated build
    needs: build
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checksum, verify manifest, sweep stale drafts, publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(gh api "repos/${{ github.repository }}/contents/apps/desktop/src-tauri/tauri.conf.json?ref=${{ github.sha }}"             --jq '.content' | base64 -d | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          TAG="v${VERSION}-build.${{ github.run_number }}"

          # The draft this run's three legs uploaded into.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --paginate             --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -1)
          [ -n "$RELEASE_ID" ] || { echo "no draft release for $TAG"; exit 1; }

          # Download by asset id — a draft's tag does not exist in git yet.
          mkdir -p release-assets
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets"             --jq '.[] | select(.name | startswith("Kavka_") and (endswith(".exe") or endswith(".msi") or endswith(".dmg"))) | "\(.id) \(.name)"' |
          while read -r ID NAME; do
            gh api "repos/${{ github.repository }}/releases/assets/$ID"               -H "Accept: application/octet-stream" > "release-assets/$NAME"
          done
          COUNT=$(ls release-assets | wc -l)
          # Three legs, four installers (Windows uploads exe + msi).
          [ "$COUNT" -ge 4 ] || { echo "expected >=4 installers, found $COUNT — a leg is missing"; ls release-assets; exit 1; }
          (cd release-assets && sha256sum Kavka_* > ../SHA256SUMS.txt)

          # The same fail-fast, one layer up. Branch builds now feed the app's
          # "Every build" channel, so a build without a complete latest.json is
          # not merely missing a nicety: the app will offer it and then fail at
          # install time, which is worse than never offering it. tauri-action
          # only WARNS when a leg has no updater artifacts to contribute, so
          # nothing upstream of here turns that into a red run.
          #
          # Presence alone is too weak a check. The three legs merge into one
          # manifest by read-modify-write with no locking, so the failure that
          # actually happens is a manifest that exists and is a platform short.
          # Assert every platform this matrix builds is present AND signed.
          MANIFEST_ID=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "latest.json") | .id' | head -1)
          [ -n "$MANIFEST_ID" ] || { echo "no latest.json on $TAG — updater artifacts never made it; in-app updates would be broken for this build"; exit 1; }
          gh api "repos/${{ github.repository }}/releases/assets/$MANIFEST_ID" \
            -H "Accept: application/octet-stream" > latest.json
          # node, not jq: this step already shells out to node for the version
          # above, so it is a dependency this job has proven it has.
          node -e '
            const m = JSON.parse(require("fs").readFileSync("latest.json", "utf8"));
            const platforms = m.platforms ?? {};
            const missing = ["darwin-aarch64", "darwin-x86_64", "windows-x86_64"]
              .filter((p) => !platforms[p]?.url || !platforms[p]?.signature);
            const carries = Object.keys(platforms).join(", ") || "nothing";
            if (missing.length) {
              console.error("latest.json has no signed entry for " + missing.join(", ") +
                " — a leg was lost in the merge; it carries " + carries);
              process.exit(1);
            }
            console.log("latest.json is complete: " + carries);
          '
          gh release upload "$TAG" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber

          # Housekeeping: drafts from superseded (cancelled) runs are invisible
          # but accumulate; sweep every OTHER v*-build.* draft before we go
          # public.
          gh api "repos/${{ github.repository }}/releases" --paginate             --jq ".[] | select(.draft and (.tag_name | startswith(\"v\") and contains(\"-build.\")) and .tag_name != \"$TAG\") | .id" |
          while read -r STALE; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$STALE"
            echo "deleted stale draft $STALE"
          done

          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -F draft=false > /dev/null
          echo "published $TAG with $COUNT installers + SHA256SUMS + latest.json"
