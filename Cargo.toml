[workspace]
resolver = "2"
members = [
    "crates/kavka-core",
    # The MCP server (Phase 5b). A member rather than a binary inside the
    # desktop package because it must build and run where Tauri, a webview and a
    # built frontend do not exist — see crates/kavka-mcp/src/lib.rs.
    "crates/kavka-mcp",
    # The companion CLI (docs/ROADMAP.md Phase 6 / fast-follow). A member for
    # the same reason kavka-mcp is one: it is a second front end of the core
    # that must build where Tauri, a webview and a built frontend do not exist
    # — see crates/kavka-cli/src/lib.rs.
    "crates/kavka-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/sahilhirani/kavka"
# None of the four members is published to crates.io — the desktop shell never
# could be, and the other three are distributed as the app, the MCP server and
# the CLI, not as libraries. Saying so makes `cargo publish` refuse by accident
# rather than by nobody having tried, and it lets the dependency gate treat
# these as private crates (deny.toml's `[licenses.private] ignore = true`)
# instead of needing a hand-maintained AGPL exception per crate.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
