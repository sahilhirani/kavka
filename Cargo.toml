[workspace]
resolver = "2"
members = [
    "crates/kavka-core",
    # The MCP server (Phase 5b). A member rather than a binary inside the
    # desktop package because it must build and run where Tauri, a webview and a
    # built frontend do not exist — see crates/kavka-mcp/src/lib.rs.
    "crates/kavka-mcp",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/sahilhirani/kavka"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
