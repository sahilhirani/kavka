[workspace]
resolver = "2"
members = [
    "crates/kavka-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Kavka-Proprietary"
repository = "https://github.com/sahilhirani/kavka"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
